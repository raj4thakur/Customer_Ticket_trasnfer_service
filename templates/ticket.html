
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Ticketing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 35px;
        }

        header h2 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            margin-top: 18px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .ticket {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 8px;
            margin-top: 15px;
            background: #fff;
        }

        .ticket h4 {
            margin: 0 0 12px;
            color: #1d4ed8;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .detail {
            background: #f8fafc;
            padding: 10px;
            border-radius: 5px;
        }

        .detail small {
            display: block;
            color: #64748b;
            margin-bottom: 5px;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Customer Support Ticketing System</h2>
</header>

<div class="container">

    <!-- Ticket Creation Form -->
    <div class="card">
        <h3>Create New Ticket</h3>

        <form id="ticketForm">

            <label>Customer ID</label>
            <input
                type="number"
                id="customer_id"
                min="1"
                required
                placeholder="Enter customer ID"
            >

            <label>Subject</label>
            <input
                type="text"
                id="subject"
                required
                placeholder="Enter ticket subject"
            >

            <label>Issue Description</label>
            <textarea
                id="issue_description"
                required
                placeholder="Describe the customer's issue..."
            ></textarea>

            <button type="submit" id="submitBtn">
                Create Ticket
            </button>

        </form>

        <div id="message"></div>
    </div>


    <!-- Ticket List -->
    <div class="card">
        <h3>All Tickets</h3>

        <button onclick="loadTickets()">
            Refresh Tickets
        </button>

        <div id="ticketList">
            <p class="empty">Loading tickets...</p>
        </div>
    </div>

</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    document.getElementById("ticketForm")
        .addEventListener("submit", async function(event) {

        event.preventDefault();

        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");
        const ticketList = document.getElementById("ticketList");

        const ticketData = {
            customer_id: Number(document.getElementById("customer_id").value),
            subject: document.getElementById("subject").value.trim(),
            issue_description: document.getElementById("issue_description").value.trim()
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating...";
        message.textContent = "";

        try {
            const response = await fetch(`${API_URL}/tickets/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(ticketData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    typeof result.detail === "string"
                        ? result.detail
                        : JSON.stringify(result.detail || result)
                );
            }

            message.style.color = "green";
            message.textContent = "Ticket created successfully!";

            // Display only the newly created ticket
            displayTicket(result);

            // Clear form
            document.getElementById("ticketForm").reset();

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;

        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create Ticket";
        }
    });


    function displayTicket(ticket) {

        const ticketList = document.getElementById("ticketList");

        ticketList.innerHTML = "";

        const card = document.createElement("div");
        card.className = "ticket";

        const heading = document.createElement("h4");
        heading.textContent = `Ticket #${ticket.ticket_id}`;

        const details = document.createElement("div");
        details.className = "details";

        const fields = [
            ["Customer ID", ticket.customer_id],
            ["Subject", ticket.subject],
            ["Issue Description", ticket.issue_description],
            ["Category", ticket.category],
            ["Urgency", ticket.urgency],
            ["Assigned Team", ticket.assigned_team],
            ["Status", ticket.resolution_status],
            ["Created At", ticket.created_at]
        ];

        fields.forEach(([label, value]) => {

            const item = document.createElement("div");
            item.className = "detail";

            const small = document.createElement("small");
            small.textContent = label;

            const strong = document.createElement("strong");
            strong.textContent = value ?? "-";

            item.append(small, strong);
            details.appendChild(item);
        });

        card.append(heading, details);
        ticketList.appendChild(card);
    }

</script>

</body>
</html>
